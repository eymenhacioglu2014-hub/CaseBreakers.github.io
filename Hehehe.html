<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

#video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover; /* tam ekran */
    display:none;
}

#start{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    padding:20px 40px;
    font-size:25px;
    border:none;
    border-radius:15px;
    cursor:pointer;
}

#closeBtn{
    position:fixed;
    top:20px;
    right:20px;
    padding:15px 25px;
    font-size:20px;
    border:none;
    border-radius:12px;
    background:red;
    color:white;
    cursor:pointer;
    display:none;
    z-index:999;
}
</style>
</head>
<body>

<button id="start">Videoyu Aç</button>

<video id="video" playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<button id="closeBtn" onclick="closeVideo()">Kapat</button>

<script>
const startBtn = document.getElementById("start");
const video = document.getElementById("video");
const closeBtn = document.getElementById("closeBtn");

startBtn.onclick = async () => {

    startBtn.style.display = "none";
    video.style.display = "block";

    // tam ekran
    if(video.requestFullscreen){
        video.requestFullscreen();
    }

    // sesiyle oynat
    video.volume = 1.0;

    await video.play();

    // 6 saniye sonra kapatma tuşu gelsin
    setTimeout(() => {
        closeBtn.style.display = "block";
    }, 6000);
};

function closeVideo(){
    video.pause();

    if(document.fullscreenElement){
        document.exitFullscreen();
    }

    video.style.display = "none";
    closeBtn.style.display = "none";
    startBtn.style.display = "block";
}
</script>

</body>
</html>

<source src="You%20are%20an%20idiot!!.mp4" type="video/mp4">
