<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading...</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

#video{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
    background:black;
}

#closeBtn{
    position:fixed;
    top:20px;
    right:20px;
    padding:14px 22px;
    font-size:18px;
    border:none;
    border-radius:12px;
    background:red;
    color:white;
    z-index:9999;
    display:none;
}
</style>
</head>
<body>

<video
id="video"
autoplay
muted
playsinline
webkit-playsinline
>
    <source src="video.mp4" type="video/mp4">
</video>

<button id="closeBtn">Kapat</button>

<script>
const video = document.getElementById("video");
const closeBtn = document.getElementById("closeBtn");

window.onload = async () => {

    try{

        if(document.documentElement.requestFullscreen){
            await document.documentElement.requestFullscreen();
        }

        video.muted = false;
        video.volume = 1.0;

        await video.play();

    }catch(e){
        console.log(e);
    }

    setTimeout(()=>{
        closeBtn.style.display = "block";
    },6000);
};

closeBtn.onclick = () => {

    video.pause();

    if(document.fullscreenElement){
        document.exitFullscreen();
    }

    document.body.innerHTML = "";
};
</script>

</body>
</html>
