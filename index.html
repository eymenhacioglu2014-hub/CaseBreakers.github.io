<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Şifre</title>
</head>
<body>

  <h2>Şifre gir</h2>
  <input type="password" id="sifre" placeholder="Şifre">
  <button onclick="kontrol()">Giriş</button>

  <script>
    function kontrol() {
      var sifre = document.getElementById("sifre").value;

      if (sifre === "1234") {
        window.location.href = "https://drive.google.com/drive/folders/1kBr6eP3-L6_xH--hUTeuUF-hiBTcUPa4";
      } else {
        alert("Yanlış şifre");
      }
    }
  </script>

</body>
</html>
